name: S2 CPS extraction
on:
  push:
  workflow_dispatch:
jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect legacy source names
        run: |
          for y in 2008 2009; do echo YEAR=$y; curl -fsSL https://www2.census.gov/programs-surveys/cps/datasets/$y/supp/ | grep -oi 'href="[^"]*"' | grep -i nov || true; done
      - name: Probe NBER legacy files
        run: |
          for base in cpsnov08c cpsnov09c; do for u in https://data.nber.org/cps/$base.dta https://data.nber.org/cps/$base.zip https://data.nber.org/cps/$base.dta.zip https://data.nber.org/cps/$base.csv; do echo $u; curl -sSIL -o /dev/null -w '%{http_code} %{url_effective}\n' $u || true; done; done
      - name: Extract S2
        run: python 06_Analysis/S2_extract_cps_2008_2013.py
      - uses: actions/upload-artifact@v4
        with:
          name: S2-CPS-2008-2013
          path: s2_out/
          retention-days: 7
